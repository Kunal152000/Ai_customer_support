version: "3.9"

services:

  db:
    image: pgvector/pgvector:pg17
    container_name: ai_support_db

    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/database/init_vector.sql:/docker-entrypoint-initdb.d/init_vector.sql

  pgadmin:
    image: dpage/pgadmin4

    container_name: ai_support_pgadmin

    restart: always
    volumes:
      - pgadmin_data:/var/lib/pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      - db

  backend:

    build: .

    container_name: ai_support_backend

    restart: always

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - db

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

volumes:
  postgres_data:
  pgadmin_data: